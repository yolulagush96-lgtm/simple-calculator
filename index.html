<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cal-container">

        <div class="screen">0</div>

    <div class="buttons">

       <button class="clear">AC</button>
       <button class="delete">DEL</button>
       <button class="operator">%</button>
       <button class="operator">+</button>

       <button class="typer">1</button>
       <button class="typer">2</button>
       <button class="typer">3</button>
       <button class="operator">×</button>

       <button class="typer">4</button>
       <button class="typer">5</button>
       <button class="typer">6</button>
       <button class="operator">÷</button>

       <button class="typer">7</button>
       <button class="typer">8</button>
       <button class="typer">9</button>
       <button class="operator">-</button>

       <button>S</button>
       <button class="typer">0</button>
       <button class="typer">.</button>
       <button class="equals">=</button>

    </div>


    </div>

    <script src="script.js"></script>

</body>
</html>
